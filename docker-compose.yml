services:
  postgres:
    image: postgres:16-alpine
    container_name: carelens-postgres
    environment:
      POSTGRES_USER: carelens
      POSTGRES_PASSWORD: carelens_dev
      POSTGRES_DB: carelens
    ports:
      - "5432:5432"
    volumes:
      - carelens_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carelens"]
      interval: 5s
      timeout: 5s
      retries: 10

  inference:
    build:
      context: ./apps/inference
    container_name: carelens-inference
    environment:
      CARELENS_MODELS_DIR: /code/models
      CARELENS_CORS_ORIGINS: ${CARELENS_CORS_ORIGINS:-*}
    ports:
      - "8001:8001"
    volumes:
      - ./models:/code/models:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: carelens-api
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://carelens:carelens_dev@postgres:5432/carelens
      PORT: 3000
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev_access_secret_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev_refresh_secret_change_me}
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      INFERENCE_URL: http://inference:8001
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@carelens.ai}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin1234}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      GROQ_MODEL_FALLBACKS: ${GROQ_MODEL_FALLBACKS:-openai/gpt-oss-120b,openai/gpt-oss-20b,allam-2-7b}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_TIMEOUT_MS: ${GROQ_TIMEOUT_MS:-20000}
    ports:
      - "3000:3000"

volumes:
  carelens_pgdata: